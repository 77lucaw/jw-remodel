<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JW Remodel | West Seattle Home Remodeling</title>
  <meta name="description" content="JW Remodel provides high-quality home remodeling in West Seattle. Bathrooms and basements with reliable, professional service.">
  <link rel="canonical" href="https://77lucaw.github.io/jw-remodel/">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="header">
  <div class="logo">JW Remodel</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="services">
  <h2>Contact Us</h2>
  <form id="contactForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Tell us about your project" required></textarea>

    <!-- Formspree settings -->
    <input type="hidden" name="_subject" value="New JW Remodel Lead">
    <!-- spam protection -->
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit" class="btn">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 JW Remodel | West Seattle</p>
</footer>

<script>
const form = document.getElementById('contactForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault(); // prevent default form submission

  const data = new FormData(form);

  try {
    const response = await fetch("https://formspree.io/f/xqegyynq", {
      method: "POST",
      body: data,
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      form.reset(); // clear the form
      window.location.href = "https://77lucaw.github.io/jw-remodel/thank-you.html"; // redirect to thank-you page
    } else {
      alert("Oops! Something went wrong. Please try again.");
    }
  } catch (error) {
    console.error(error);
    alert("Oops! Something went wrong. Please try again.");
  }
});
</script>

</body>
</html>
